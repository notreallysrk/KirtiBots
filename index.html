<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirti Bots | Premium Telegram Bots</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Professional Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #091221 0%, #1e2a3a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .header img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }
        h1 {
            margin: 0 0 10px 0;
            font-weight: 700;
            font-size: 2.2rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .section {
            margin-bottom: 30px;
            text-align: left;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }
        .section-title i {
            color: var(--primary);
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }
        .btn:hover {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.2);
        }
        
        /* Mobile Responsive */
        @media (max-width: 480px) {
            .btn-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER SECTION -->
        <div class="header">
            <!-- Profile Logo (Auto-generated Kirti Bots Logo) -->
            <img src="https://ui-avatars.com/api/?name=Kirti+Bots&background=00f2fe&color=0f172a&size=200&bold=true" alt="Kirti Bots Logo">
            <h1>Kirti Bots</h1>
            <div class="subtitle">Experience high-quality music and seamless community management with our advanced Telegram bots.</div>
        </div>

        <!-- MUSIC BOTS SECTION -->
        <div class="section">
            <div class="section-title"><i class="fa-solid fa-music"></i> Our Music Bots</div>
            <div class="btn-grid">
                <a href="https://t.me/Hinduprobot" target="_blank" class="btn">
                    <i class="fa-solid fa-robot"></i> @Hinduprobot
                </a>
                <a href="https://t.me/Kirtiprobot" target="_blank" class="btn">
                    <i class="fa-solid fa-robot"></i> @Kirtiprobot
                </a>
            </div>
        </div>

        <!-- COMMUNITY SECTION -->
        <div class="section">
            <div class="section-title"><i class="fa-solid fa-users"></i> Community & Support</div>
            <div class="btn-grid">
                <a href="https://t.me/kirti_bots" target="_blank" class="btn">
                    <i class="fa-solid fa-bullhorn"></i> Channel
                </a>
                <a href="https://t.me/kirti_bots_support" target="_blank" class="btn">
                    <i class="fa-solid fa-headset"></i> Support Group
                </a>
            </div>
        </div>

        <!-- TEAM SECTION -->
        <div class="section">
            <div class="section-title"><i class="fa-solid fa-shield-halved"></i> Team</div>
            <div class="btn-grid">
                <a href="https://t.me/ll_Alone_lll" target="_blank" class="btn">
                    <i class="fa-solid fa-crown"></i> Owner
                </a>
                <a href="https://t.me/ll_Alone_lll" target="_blank" class="btn">
                    <i class="fa-solid fa-code"></i> Developer
                </a>
            </div>
        </div>
    </div>

</body>
</html>
